name: PlanTogether
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  PlanTogether:
    type: application
    platform: iOS
    sources:
      - PlanTogether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PlanTogether
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 약속 가능한 시간을 찾기 위해 캘린더 일정을 사용합니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - PlanTogetherTests
  PlanTogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlanTogetherTests
    dependencies:
      - target: PlanTogether
