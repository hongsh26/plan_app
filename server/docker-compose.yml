# 로컬 개발용 PostgreSQL. account_backend_design.md §12는 배포 시 관리형
# Multi-AZ PostgreSQL을 쓰지만, 로컬은 이 Compose로 충분하다.
#
# 여기 담긴 비밀번호는 로컬 전용이다. 스테이징·프로덕션 자격은 §12에 따라
# 분리하고 secret manager에서 주입한다. 이 파일의 값을 어디에도 재사용하지 않는다.

services:
  db:
    # 태그를 정확히 고정한다. major만 고정하면 재기동 때 patch가 바뀌어
    # 로컬과 CI가 서로 다른 버전을 볼 수 있다.
    # xid8과 pg_current_xact_id()는 PostgreSQL 13+ 기능이므로 §7.1의
    # sync 순서 키에 필요한 최소 버전을 충분히 넘는다.
    image: postgres:18.2-alpine
    container_name: plantogether-db
    environment:
      POSTGRES_DB: plantogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_password
      # 로컬 개발 편의를 위한 설정이다. 프로덕션에서 쓰지 않는다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # 컨테이너 첫 기동 시 §11의 DB 역할 분리를 적용한다.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # readiness 실험에서 컨테이너가 실제로 준비됐는지 판정한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantogether"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  db_data:
