openapi: 3.1.0

# P1 인증 범위까지의 계약을 담는다.
#
# 담긴 것: 운영 health endpoint, 인증(§5), 계정·기기 조회와 변경.
# 아직 없는 것: DELETE /v1/me(삭제 파이프라인과 함께), POST /v1/sync(mutation 배치),
# calendar-write-commands.
# 구현보다 계약을 먼저 적으면 handler와 어긋난 채로 남기 쉽다.
#
# 모든 mutation은 Idempotency-Key 헤더가 필수다(인증 endpoint 제외). 수정·삭제는
# If-Match 헤더에 현재 version을 강한 ETag로 싣는다(예: If-Match: "3"). 조회와 변경
# 응답의 ETag 헤더 값을 그대로 쓰면 된다.
#
# health endpoint는 /v1 아래에 두지 않는다. API 버전 계약의 일부가 아니라
# 인프라(load balancer, 오케스트레이터)가 보는 운영 endpoint이기 때문이다.
#
# 모든 응답에는 X-Request-ID 헤더가 있다. 서버가 발급하며 클라이언트 값을
# 채택하지 않는다.

info:
  title: PlanTogether Server
  version: 0.1.0
  description: |
    Launch MVP 서버 API. 기준 설계는 docs/account_backend_design.md다.

    인증 endpoint(/v1/auth/*)는 §6의 Idempotency-Key 규칙 밖이다. 로그인
    시점에는 idempotency 키를 묶을 user_id·device_id가 없다.

security:
  - bearerAuth: []

servers:
  - url: http://localhost:8080
    description: 로컬 개발

paths:
  /livez:
    get:
      summary: liveness 검사
      description: |
        프로세스가 살아 있는지만 보고한다. DB를 비롯한 어떤 외부 의존성도
        확인하지 않는다. liveness가 DB에 의존하면 DB 장애가 모든 API
        인스턴스의 재시작 루프로 번진다.
      operationId: getLiveness
      tags: [operations]
      security: []
      responses:
        "200":
          description: 프로세스가 요청을 처리할 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /readyz:
    get:
      summary: readiness 검사
      description: |
        트래픽을 받을 준비가 됐는지 보고한다. DB 왕복에 의존하므로 DB가
        닿지 않으면 503을 반환하고 load balancer가 이 인스턴스를 제외한다.

        account_backend_design.md §11에 따라 응답에 token, 자격, 내부 상세를
        포함하지 않는다. 실패 원인은 서버 로그에만 남는다.
      operationId: getReadiness
      tags: [operations]
      security: []
      responses:
        "200":
          description: DB에 연결할 수 있어 트래픽을 받을 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "503":
          description: DB에 연결할 수 없어 트래픽을 받을 수 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable

  /v1/auth/apple:
    post:
      summary: Apple 로그인·가입
      description: |
        account_backend_design.md §5.1. identity token의 서명·iss·aud·exp·nonce를
        검증하고 authorization code를 즉시 교환한다. 같은 Apple subject는 같은
        user_id에 연결된다. 로그인할 때마다 서버가 새 device_id를 발급한다.

        raw_nonce는 iOS가 만든 원문이다. iOS는 그 SHA-256 hex를 Apple 요청의
        nonce로 보내야 한다.
      operationId: signInWithApple
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: 로그인 성공.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/auth/refresh:
    post:
      summary: refresh token 회전
      description: |
        §5.2. 성공하면 이전 refresh token은 폐기되고 새 쌍이 발급된다. 이미 쓰인
        token을 다시 보내면 탈취로 간주해 그 기기의 token family와 기기를 모두
        폐기하고 401을 반환한다. 응답을 잃고 같은 token으로 재시도해도 같다.
      operationId: refreshSession
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 회전 성공.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/auth/logout:
    post:
      summary: 현재 기기 로그아웃
      description: |
        §5.2. 현재 기기의 세션과 기기 자체를 폐기한다. 다른 기기는 영향이 없다.
        이미 로그아웃한 기기에 다시 호출해도 성공한다(access token이 아직
        인증되는 동안).
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: 로그아웃됐다.
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/me:
    get:
      summary: 내 계정 조회
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: 계정 정보. ETag에 version이 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
    patch:
      summary: 프로필 수정
      description: |
        현재 바꿀 수 있는 것은 표시 이름뿐이다. 제어 문자와 bidi override 같은 서식
        문자를 지우고 50자로 자른다. 남는 것이 없으면 400이다.
      operationId: updateMe
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 수정됨. 재전송이면 Idempotent-Replayed 헤더가 있고 본문은 현재 상태다.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/devices:
    get:
      summary: 로그인된 기기 목록
      description: |
        §5.2. 폐기되지 않은 기기만 보여준다. push token은 반환하지 않는다.
      operationId: listDevices
      tags: [account]
      responses:
        "200":
          description: 기기 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/sync/bootstrap:
    get:
      summary: 전체 snapshot과 cursor watermark
      description: |
        §7.2. 호출 사용자가 볼 수 있는 전체 상태를 entity 목록으로 준다. 각 entity는
        증분 변경과 같은 모양이다(operation은 upsert). 클라이언트는 한 로컬 트랜잭션에서
        기존 서버 투영을 이것으로 바꾸고 cursor를 cursor_watermark로 둔다.

        보장은 "최소 한 번 전달 + version 비교로 한 번 적용"이다. snapshot에 이미 반영된
        변경이 이후 증분으로 다시 올 수 있다. 클라이언트는 tombstone을 먼저 적용하고
        version이 더 큰 upsert만 적용한다.
      operationId: syncBootstrap
      tags: [sync]
      responses:
        "200":
          description: snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/sync:
    get:
      summary: 증분 변경
      description: |
        §7.1. cursor 뒤의 변경을 순서대로 준다. 진행 중인 트랜잭션보다 뒤의 변경은 그
        트랜잭션이 끝날 때까지 보류한다(settled horizon). has_more가 true면 받은 cursor로
        곧바로 다시 부른다. 변경이 없어도 새 cursor를 주므로 항상 받은 cursor를 저장한다.

        cursor는 opaque 문자열이다. 파싱하거나 만들지 않는다. 29일보다 오래된 cursor는
        410 sync_cursor_expired이며 bootstrap을 다시 받아야 한다.
      operationId: syncRead
      tags: [sync]
      parameters:
        - name: cursor
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: 변경 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          description: cursor가 보존 기간을 지났다. code는 sync_cursor_expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/devices/{id}:
    delete:
      summary: 기기 폐기
      description: |
        §5.2. 같은 사용자의 어느 기기든 폐기할 수 있다. 기기와 그 세션이 즉시
        무효가 된다. 현재 기기를 지정하면 로그아웃과 같다. 다른 사용자의 기기와
        이미 폐기된 기기는 404다. 본문을 보내지 않는다.
      operationId: revokeDevice
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 폐기됨. 재전송이면 Idempotent-Replayed 헤더가 있다.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/devices/{id}/push-token:
    put:
      summary: APNs token과 알림 권한 상태 등록
      description: |
        {id}는 요청한 기기 자신이어야 한다(access token의 기기). 아니면 403이다.
        push_token과 push_environment는 함께 보내거나 함께 null이다. null이면 저장된
        token을 지운다. token은 서버에서 암호화해 저장하고 어떤 응답에도 돌려주지 않는다.
      operationId: putPushToken
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "200":
          description: 등록됨.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        1~128자의 출력 가능한 ASCII. 클라이언트는 UUID를 쓴다. (사용자, 기기, 키) 단위로
        30일간 결과를 보존한다. 같은 키로 같은 요청(method, route, 본문 바이트)을 다시
        보내면 원래 결과를 돌려주고, 다른 요청이면 409 idempotency_mismatch다.
      schema: {type: string, minLength: 1, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 현재 version을 강한 ETag로 싣는다. 예 "3". 약한 ETag와 *는 받지 않는다.
      schema: {type: string}
    DeviceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    IdempotentReplayed:
      description: 저장된 결과를 돌려준 재전송이면 "true". 본문은 현재 리소스 상태다.
      schema: {type: string, enum: ["true"]}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 15분 수명의 access token. 서명 외에 기기 폐기와 계정 상태를 매 요청 DB에서 확인한다.

  responses:
    Conflict:
      description: |
        version_conflict(낡은 If-Match, current_version 포함) 또는
        idempotency_mismatch(같은 키를 다른 요청에 재사용).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 인증됐지만 대상 권한이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 없거나 이 사용자가 볼 수 없는 대상. 둘을 구분하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: 형식 또는 필드 검증 실패.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSession:
      description: 자격이 무효다. 원인(만료, 폐기, 위조, 재사용)을 구분하지 않는다. 클라이언트는 refresh를 시도하고, refresh도 401이면 다시 로그인한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: 계정이 active가 아니다(disabled, deletion_requested, deleting, deleted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Apple 같은 외부 의존성 장애. 사용자 자격 문제가 아니므로 클라이언트는 로그아웃하지 않고 재시도한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          description: |
            운영 상태만 나타낸다. 진단 상세를 담지 않는다.

    ErrorResponse:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_session, forbidden, not_found, version_conflict,
                 idempotency_mismatch, sync_cursor_expired, account_locked, rate_limited, internal]
        message:
          type: string
          description: 사람이 읽는 짧은 설명. 클라이언트는 code로 분기한다.
        request_id:
          type: string
          format: uuid
        current_version:
          type: integer
          format: int64
          description: version_conflict에서만 있다.

    SignInRequest:
      type: object
      required: [identity_token, authorization_code, raw_nonce]
      additionalProperties: false
      properties:
        identity_token:
          type: string
        authorization_code:
          type: string
          description: 1회용, 5분 유효. 서버가 즉시 Apple과 교환한다.
        raw_nonce:
          type: string
        display_name:
          type: string
          description: Apple이 최초 동의 때 준 이름. 신규 가입에만 쓴다. 제어 문자는 지우고 50자로 자른다.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string

    SessionResponse:
      type: object
      required: [request_id, user_id, device_id, access_token, access_token_expires_at,
                 refresh_token, refresh_token_expires_at, new_user]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        device_id:
          type: string
          format: uuid
          description: 서버가 발급한 기기 ID. access token에 결합돼 있다.
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token:
          type: string
          description: Keychain에만 저장한다. 로그·분석 이벤트에 남기지 않는다.
        refresh_token_expires_at: {type: string, format: date-time}
        new_user: {type: boolean}

    User:
      type: object
      required: [id, display_name, status, version, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        status:
          type: string
          enum: [active, disabled, deletion_requested, deleting, deleted]
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    MeResponse:
      type: object
      required: [request_id, user, notification_ref_key]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        user:
          $ref: "#/components/schemas/User"
        notification_ref_key:
          $ref: "#/components/schemas/NotificationRefKey"

    Device:
      type: object
      required: [id, platform, current, push_authorization, time_sensitive_setting,
                 last_seen_at, version, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        platform: {type: string, enum: [ios]}
        current:
          type: boolean
          description: 이 요청을 보낸 기기인지.
        push_authorization:
          type: string
          enum: [unknown, authorized, provisional, denied]
        time_sensitive_setting:
          type: string
          enum: [enabled, disabled, not_supported]
        last_seen_at: {type: [string, "null"], format: date-time}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    DevicesResponse:
      type: object
      required: [request_id, devices]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    UpdateMeRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: {type: string}

    PushTokenRequest:
      type: object
      required: [push_token, push_environment, push_authorization, time_sensitive_setting]
      additionalProperties: false
      properties:
        push_token:
          type: [string, "null"]
          description: APNs device token의 hex 문자열(32~100바이트). null이면 저장된 token을 지운다.
        push_environment:
          type: [string, "null"]
          enum: [sandbox, production, null]
        push_authorization:
          type: string
          enum: [unknown, authorized, provisional, denied]
        time_sensitive_setting:
          type: string
          enum: [enabled, disabled, not_supported]

    DeviceResponse:
      type: object
      required: [request_id, device]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        device:
          $ref: "#/components/schemas/Device"

    NotificationRefKey:
      type: string
      description: |
        본인 전용 32바이트 키(base64url, 패딩 없음). 알림 payload의 party_ref·entity_ref를
        역조회하는 데 쓴다(notification_design.md §4.3). 공유 keychain access group에만
        저장하고 로그에 남기지 않는다.

    SyncChange:
      type: object
      required: [entity_type, entity_id, operation, version, payload]
      additionalProperties: false
      properties:
        entity_type: {type: string, description: "user, device, 이후 도메인이 더한다"}
        entity_id: {type: string, format: uuid}
        operation: {type: string, enum: [upsert, tombstone]}
        version:
          type: [integer, "null"]
          format: int64
          description: upsert에만 있다. tombstone은 null.
        payload:
          type: object
          description: 최소 projection. 캘린더 상세와 token은 담지 않는다.

    SyncResponse:
      type: object
      required: [request_id, changes, cursor, has_more, server_time]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        cursor: {type: string}
        has_more: {type: boolean}
        server_time: {type: string, format: date-time}

    BootstrapResponse:
      type: object
      required: [request_id, schema_version, snapshot, cursor_watermark, server_time, notification_ref_key]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        schema_version: {type: integer, enum: [1]}
        snapshot:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        cursor_watermark: {type: string}
        server_time: {type: string, format: date-time}
        notification_ref_key:
          $ref: "#/components/schemas/NotificationRefKey"
