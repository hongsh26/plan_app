openapi: 3.1.0

# 서버에 등록된 모든 route의 계약을 담는다.
#
# 담긴 것: 운영 health endpoint, 인증(§5), 계정·기기, sync, Party·초대·멤버십·공개 수준·일정,
# 캘린더 연결·snapshot, 활동 시간, 가능 시간 검색.
# 아직 없는 것: POST /v1/sync(mutation 배치), 제안(설계 7), calendar-write-commands.
# PUT /v1/calendar/connection 요청 본문 schema는 아직 없다. 응답과 실제 handler의 자동 대조도 아직 없다(§15).
# 구현보다 계약을 먼저 적으면 handler와 어긋난 채로 남기 쉽다.
#
# 모든 mutation은 Idempotency-Key 헤더가 필수다(인증 endpoint 제외). 수정·삭제는
# If-Match 헤더에 현재 version을 강한 ETag로 싣는다(예: If-Match: "3"). 조회와 변경
# 응답의 ETag 헤더 값을 그대로 쓰면 된다.
#
# health endpoint는 /v1 아래에 두지 않는다. API 버전 계약의 일부가 아니라
# 인프라(load balancer, 오케스트레이터)가 보는 운영 endpoint이기 때문이다.
#
# 모든 응답에는 X-Request-ID 헤더가 있다. 서버가 발급하며 클라이언트 값을
# 채택하지 않는다.

info:
  title: PlanTogether Server
  version: 0.1.0
  description: |
    Launch MVP 서버 API. 기준 설계는 docs/account_backend_design.md다.

    인증 endpoint(/v1/auth/*)는 §6의 Idempotency-Key 규칙 밖이다. 로그인
    시점에는 idempotency 키를 묶을 user_id·device_id가 없다.

security:
  - bearerAuth: []

servers:
  - url: http://localhost:8080
    description: 로컬 개발

paths:
  /livez:
    get:
      summary: liveness 검사
      description: |
        프로세스가 살아 있는지만 보고한다. DB를 비롯한 어떤 외부 의존성도
        확인하지 않는다. liveness가 DB에 의존하면 DB 장애가 모든 API
        인스턴스의 재시작 루프로 번진다.
      operationId: getLiveness
      tags: [operations]
      security: []
      responses:
        "200":
          description: 프로세스가 요청을 처리할 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /readyz:
    get:
      summary: readiness 검사
      description: |
        트래픽을 받을 준비가 됐는지 보고한다. DB 왕복에 의존하므로 DB가
        닿지 않으면 503을 반환하고 load balancer가 이 인스턴스를 제외한다.

        account_backend_design.md §11에 따라 응답에 token, 자격, 내부 상세를
        포함하지 않는다. 실패 원인은 서버 로그에만 남는다.
      operationId: getReadiness
      tags: [operations]
      security: []
      responses:
        "200":
          description: DB에 연결할 수 있어 트래픽을 받을 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "503":
          description: DB에 연결할 수 없어 트래픽을 받을 수 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable

  /v1/auth/apple:
    post:
      summary: Apple 로그인·가입
      description: |
        account_backend_design.md §5.1. identity token의 서명·iss·aud·exp·nonce를
        검증하고 authorization code를 즉시 교환한다. 같은 Apple subject는 같은
        user_id에 연결된다. 로그인할 때마다 서버가 새 device_id를 발급한다.

        raw_nonce는 iOS가 만든 원문이다. iOS는 그 SHA-256 hex를 Apple 요청의
        nonce로 보내야 한다.
      operationId: signInWithApple
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: 로그인 성공.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/auth/refresh:
    post:
      summary: refresh token 회전
      description: |
        §5.2. 성공하면 이전 refresh token은 폐기되고 새 쌍이 발급된다. 이미 쓰인
        token을 다시 보내면 탈취로 간주해 그 기기의 token family와 기기를 모두
        폐기하고 401을 반환한다. 응답을 잃고 같은 token으로 재시도해도 같다.
      operationId: refreshSession
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 회전 성공.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      summary: 현재 기기 로그아웃
      description: |
        §5.2. 현재 기기의 세션과 기기 자체를 폐기한다. 다른 기기는 영향이 없다.
        이미 로그아웃한 기기에 다시 호출해도 성공한다(access token이 아직
        인증되는 동안).
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: 로그아웃됐다.
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/me:
    get:
      summary: 내 계정 조회
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: 계정 정보. ETag에 version이 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
    patch:
      summary: 프로필 수정
      description: |
        현재 바꿀 수 있는 것은 표시 이름뿐이다. 제어 문자와 bidi override 같은 서식
        문자를 지우고 50자로 자른다. 남는 것이 없으면 400이다.
      operationId: updateMe
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 수정됨. 재전송이면 Idempotent-Replayed 헤더가 있고 본문은 현재 상태다.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"
    delete:
      summary: 계정 삭제 요청
      description: |
        §10. 빈 body로 보낸다. 한 트랜잭션에서 계정을 deletion_requested로 바꾸고,
        모든 세션과 기기를 폐기하며 account_deletion job을 enqueue한다.

        성공하면 access token의 기기가 즉시 폐기되므로 같은 요청을 재전송해도
        idempotency replay까지 가지 않고 인증 계층에서 401 invalid_session 또는
        423 account_locked로 차단된다.
      operationId: deleteMe
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: 삭제 요청이 접수됐다. 본문은 deletion_requested 상태의 현재 사용자다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/devices:
    get:
      summary: 로그인된 기기 목록
      description: |
        §5.2. 폐기되지 않은 기기만 보여준다. push token은 반환하지 않는다.
      operationId: listDevices
      tags: [account]
      responses:
        "200":
          description: 기기 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/sync/bootstrap:
    get:
      summary: 전체 snapshot과 cursor watermark
      description: |
        §7.2. 호출 사용자가 볼 수 있는 전체 상태를 entity 목록으로 준다. 각 entity는
        증분 변경과 같은 모양이다(아래의 하한 항목을 빼면 operation은 upsert). 클라이언트는 한 로컬 트랜잭션에서
        기존 서버 투영을 이것으로 바꾸고 cursor를 cursor_watermark로 둔다.

        보장은 "최소 한 번 전달 + version 비교로 한 번 적용"이다. snapshot에 이미 반영된
        변경이 이후 증분으로 다시 올 수 있다. 클라이언트는 tombstone을 먼저 적용하고
        version이 더 큰 upsert만 적용한다.

        entity는 upsert다. 단 하한 전용 version 있는 tombstone 항목이 함께 온다. row를 만들지 않고 하한만 기록한다.
        (1) 호출자가 최근 30일 안에 끝낸 본인 멤버십(SyncChange 규칙 (a)에 쓴다), (2) watermark 뒤에 upsert가 다시 올
        수 있는 entity. Party 범위는 끝난 entity(끝난 초대·삭제된 projection 등)의 tombstone version, 그 밖(user, device,
        availability_preference)은 watermark 아래 최대 version이다. 폐기한 기기가 옛 upsert로 되살아나지 않게 한다. 같은 entity의 하한 항목이 여러 개면 최대값을 쓴다.
        하한 항목의 scope_membership_id는 null일 수 있다(migration 00018 이전에 기록된 tombstone).
      operationId: syncBootstrap
      tags: [sync]
      responses:
        "200":
          description: snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/sync:
    get:
      summary: 증분 변경
      description: |
        §7.1. cursor 뒤의 변경을 순서대로 준다. 진행 중인 트랜잭션보다 뒤의 변경은 그
        트랜잭션이 끝날 때까지 보류한다(settled horizon). has_more가 true면 받은 cursor로
        곧바로 다시 부른다. 변경이 없어도 새 cursor를 주므로 항상 받은 cursor를 저장한다.

        cursor는 opaque 문자열이다. 파싱하거나 만들지 않는다. 29일보다 오래된 cursor는
        410 sync_cursor_expired이며 bootstrap을 다시 받아야 한다.
      operationId: syncRead
      tags: [sync]
      parameters:
        - name: cursor
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: 변경 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          description: cursor가 보존 기간을 지났다. code는 sync_cursor_expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/devices/{id}:
    delete:
      summary: 기기 폐기
      description: |
        §5.2. 같은 사용자의 어느 기기든 폐기할 수 있다. 기기와 그 세션이 즉시
        무효가 된다. 현재 기기를 지정하면 로그아웃과 같다. 다른 사용자의 기기와
        이미 폐기된 기기는 404다. 본문을 보내지 않는다.
      operationId: revokeDevice
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 폐기됨. 재전송이면 Idempotent-Replayed 헤더가 있다.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/devices/{id}/push-token:
    put:
      summary: APNs token과 알림 권한 상태 등록
      description: |
        {id}는 요청한 기기 자신이어야 한다(access token의 기기). 아니면 403이다.
        push_token과 push_environment는 함께 보내거나 함께 null이다. null이면 저장된
        token을 지운다. token은 서버에서 암호화해 저장하고 어떤 응답에도 돌려주지 않는다.
      operationId: putPushToken
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "200":
          description: 등록됨.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/parties:
    get:
      summary: 내 Party 목록
      description: |
        호출자의 활성 멤버십이 있는 활성 Party만 준다(bootstrap scope와 같다). 떠났거나 해산된 Party는 없다.
        각 항목은 Party, 호출자 본인의 멤버십, 활성 멤버 수다. 참여 한도가 20이라 페이지를 나누지 않는다.
        순서는 호출자의 가입 시각 오름차순이다.
      operationId: listMyParties
      tags: [party]
      responses:
        "200":
          description: 목록. 없으면 빈 배열.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyListResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Party 생성
      description: |
        T1. 생성자는 방장이고 공개 수준은 busyOnly다. 소유 10개·참여 20개 한도를 넘으면 409
        party_owned_limit_reached·party_joined_limit_reached. 이름은 앞뒤 공백을 지우고 연속 공백을 하나로
        줄인 뒤 1~40 rune이다.
      operationId: createParty
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyNameRequest"
      responses:
        "201":
          description: 만든 Party. ETag는 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /v1/parties/{id}:
    get:
      summary: Party 상세
      description: 활성 멤버만 본다. 비멤버·떠난 멤버·해산된 Party는 모두 404다.
      operationId: getParty
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
      responses:
        "200":
          description: Party. ETag는 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Party 이름 수정
      description: 방장만 호출한다. If-Match는 Party version이다.
      operationId: updateParty
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyNameRequest"
      responses:
        "200":
          description: 수정된 Party. ETag는 새 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/memberships:
    get:
      summary: 활성 멤버 목록
      description: 활성 멤버만 본다. 활성 멤버십만 가입 시각 순서로 준다.
      operationId: listPartyMemberships
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
      responses:
        "200":
          description: 멤버 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyMembershipsResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/parties/{id}/owner:
    post:
      summary: 방장 위임
      description: |
        T4. 방장만 호출한다. 대상은 같은 Party의 다른 활성 멤버여야 한다(아니면 400). 활성 초대는 모두
        무효화되고 그 tombstone은 이전·새 방장에게만 간다. 응답은 위임 직후 Party다(요청자는 이제 일반 멤버).
      operationId: transferPartyOwner
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              additionalProperties: false
              properties:
                user_id: {type: string, format: uuid}
      responses:
        "200":
          description: 위임된 Party. ETag는 새 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/invites:
    post:
      summary: 초대 생성
      description: |
        T2. 방장만 호출한다. token 원문은 이 201 응답에만 있다. 같은 Idempotency-Key 재전송은 메타데이터만
        돌려주고 token은 없다(원문을 저장하지 않는다). 응답을 잃었으면 초대를 무효화하고 새로 만든다.
        활성 초대 3개(409 party_invite_limit_reached), 시간당 10개(429), 정원(409 party_full) 제한이 있다.
      operationId: createPartyInvite
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartyInviteRequest"
      responses:
        "201":
          description: 만든 초대(첫 응답에만 token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyInviteEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"
        "429":
          description: 이 Party의 시간당 초대 생성 한도(10)를 넘었다. code rate_limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: 활성 초대 목록
      description: 방장만 본다. 만료 시각이 지나지 않은 active 초대만 준다. token 원문은 없다.
      operationId: listPartyInvites
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
      responses:
        "200":
          description: 초대 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyInvitesResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/invites/{invite_id}:
    delete:
      summary: 초대 무효화
      description: 방장만 호출한다. 이미 active가 아니면 상태를 바꾸지 않고 현재 초대를 200으로 돌려준다.
      operationId: revokePartyInvite
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - name: invite_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 무효화된(또는 이미 끝난) 초대.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyInviteEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/invites/{token}/preview:
    get:
      summary: 초대 미리보기
      description: |
        Party 이름, 활성 멤버 수, 초대자 표시 이름만 준다. 만료·무효·소진·해산·미존재는 모두 같은 404다.
        요청 제한(사용자 10/분, IP 30/분)은 token 형식 검사보다 먼저 센다.
      operationId: previewInvite
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: 미리보기.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreviewEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/invites/{token}/accept:
    post:
      summary: 초대 수락(가입)
      description: |
        T3. 신규 멤버는 같은 트랜잭션의 sync로 Party 단위 부트스트랩(party, 모든 활성 멤버십, 본인 공개 설정,
        허용된 projection)을 받는다. 이미 활성 멤버면 409 already_member, 정원이면 409 party_full, 참여 한도면
        409 party_joined_limit_reached. 만료·무효·소진·해산·미존재는 404다. 요청 제한(사용자 5/분, IP 30/분)은
        같은 키의 재전송도 센다. 재전송은 현재 상태를 평가해 이미 떠났으면 404, 해산됐으면 410이다.
      operationId: acceptInvite
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/InviteToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 가입한 Party와 본인 멤버십. ETag는 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/parties/{id}/visibility/me:
    get:
      summary: 내 Party 일정 공개 수준 조회
      operationId: getMyPartyVisibility
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
      responses:
        "200":
          description: 본인의 설정만 반환한다. ETag는 설정 version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyVisibilityEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: 내 Party 일정 공개 수준 변경
      description: |
        활성 멤버 본인만 변경한다. 상세 공개 또는 장소 공유를 켜면 상세 snapshot이
        완료될 때까지 시간만 투영하고 202를 반환한다. 하향 변경과 projection 삭제는
        한 트랜잭션에서 커밋한다. 설정값은 다른 멤버에게 공개하지 않는다.
      operationId: updateMyPartyVisibility
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyVisibilityRequest"
      responses:
        "200":
          description: 설정 적용 완료.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyVisibilityEnvelope"
        "202":
          description: 설정은 저장됐고 상세 snapshot 갱신을 기다린다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyVisibilityEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/parties/{id}/memberships/me:
    delete:
      summary: Party 탈퇴
      description: |
        본인 멤버십을 left로 끝내고 본인의 이 Party projection과 공개 설정을 같은 트랜잭션에서
        지운다. 다른 활성 멤버가 있는 방장은 409 owner_transfer_required다. 단독 방장의 탈퇴는
        해산이다. 오프라인 큐 재전송을 위해 이미 비활성이면 현재 멤버십과 200을 돌려준다.
        Party가 해산됐으면 410 party_disbanded이며 클라이언트는 둘 다 탈퇴 완료로 처리한다.
      operationId: leaveParty
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 탈퇴 완료 또는 이미 탈퇴한 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyMembershipEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/memberships/{user_id}:
    delete:
      summary: 멤버 강퇴
      description: |
        방장만 호출한다. 대상 멤버십을 removed로 끝내고 대상의 projection과 공개 설정을 지운다.
        방장 자신은 대상이 될 수 없다(400). 강퇴 사유는 받지 않는다.
      operationId: removePartyMember
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 강퇴된 멤버십.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyMembershipEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/disband:
    post:
      summary: Party 해산
      description: |
        방장만 호출한다. Party를 disbanded로, 모든 활성 멤버십을 removed(party_disbanded)로 바꾸고
        projection·공개 설정을 지우며 활성 초대를 무효화한다. 해산 직전 멤버 전원에게 tombstone을
        보낸다. 재전송은 현재 권한 평가에서 410을 받는다.
      operationId: disbandParty
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 해산된 Party. ETag는 새 Party version이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/PartyDisbanded"

  /v1/parties/{id}/schedule:
    get:
      summary: Party에 공개된 일정 조회
      description: |
        활성 멤버에게 기간 내 projection만 반환한다. 숨김 일정은 반환하지 않는다.
        상세 복호화에 실패한 항목은 시간만 공개한다. 원본 일정 식별자와 설정값은
        반환하지 않는다.
      operationId: getPartySchedule
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - name: start_at
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end_at
          in: query
          required: true
          description: start_at 이후이며 조회 범위는 최대 31일이다.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: 허용된 일정 projection 목록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyScheduleEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/calendar/connection:
    get:
      summary: 내 캘린더 연결 조회
      description: 본인 연결만 준다. 연결이 없으면 status disconnected, version 0, 빈 sources다.
      operationId: getCalendarConnection
      tags: [calendar]
      responses:
        "200":
          description: 연결.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarConnectionEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
    put:
      summary: 캘린더 연결 상태·읽기 source·sync 기기 변경
      description: |
        If-Match가 없으면 create-only, 있으면 그 version일 때만 갱신한다. 요청 본문 schema는 아직 등재하지 않았다
        (status, time_zone, sources, claim_sync_device).
      operationId: putCalendarConnection
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        "200":
          description: |
            갱신된 연결.
            - **syncing 중 enabled source 집합이 바뀌면 서버가 열린 업로드를 폐기하고 상태를 selecting으로 바꾼다.**
              클라이언트는 새 source로 snapshot을 다시 만든다. ready에서 바꾸면 상태는 ready로 남지만 새 snapshot이
              완료될 때까지 이전 데이터는 다른 멤버에게 보이지 않고 가능 시간 검색에도 쓰이지 않는다.
            - sync 기기를 다른 기기로 바꾸면 이전 기기의 열린 업로드도 폐기된다.
            - disabled 항목의 추가·삭제는 source 변경이 아니다.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/calendar/snapshots:
    post:
      summary: 캘린더 snapshot 세션 생성
      description: details_included는 빈 snapshot에서도 상세 allowlist 검사를 완료했음을 표시한다.
      operationId: createCalendarSnapshot
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarSnapshotRequest"
      responses:
        "201": {description: 세션 생성됨}
        "200": {description: 같은 revision의 세션 재사용}
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/calendar/snapshots/{id}/pages/{n}:
    put:
      summary: 캘린더 snapshot page 업로드
      description: |
        title과 location은 상세 allowlist다. location은 title 없이 보낼 수 없다.
        상세 필드는 암호화된 staging에만 저장하고 Busy facts에는 보관하지 않는다.
      operationId: putCalendarSnapshotPage
      tags: [calendar]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: n, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 199}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSnapshotPageRequest"
      responses:
        "200": {description: page 저장됨}
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/calendar/snapshots/{id}/complete:
    post:
      summary: 캘린더 snapshot 완료
      description: |
        활성 Busy facts와 Party projection을 같은 트랜잭션에서 교체한다.
        전체 fact에 상세 allowlist가 있거나 빈 snapshot에 details_included가 선언된
        경우에만 details 갱신 대기를 해제한다.
      operationId: completeCalendarSnapshot
      tags: [calendar]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fact_count]
              additionalProperties: false
              properties:
                fact_count: {type: integer, minimum: 0, maximum: 20000}
      responses:
        "200": {description: snapshot 완료}
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/calendar/snapshots/{id}/abort:
    post:
      summary: 캘린더 snapshot 중단
      description: |
        sync 기기만 호출한다(아니면 403). 본문을 보내지 않는다. 열린 세션이면 staging을 지우고 aborted로 바꾼다.
        연결이 syncing이면 쓸 수 있는 이전 generation이 있을 때만 ready, 아니면 selecting으로 돌린다. 이미 완료된
        세션은 409 calendar_snapshot_state, 이미 중단된 세션은 그대로 200이다.
      operationId: abortCalendarSnapshot
      tags: [calendar]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 중단된 세션과 현재 연결.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSnapshotEnvelope"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/availability/preferences/me:
    get:
      summary: 내 활동 시간 조회
      description: |
        본인 주간 활동 규칙·시간대·version만 반환한다. 다른 사용자 규칙을 조회하는 endpoint는 없다.
        설정한 적이 없으면 status unconfigured, version 0, time_zone null, 빈 weekly_intervals이고
        ETag 헤더가 없다. 첫 저장은 If-Match 없이(create-only) 보낸다.
      operationId: getMyAvailabilityPreferences
      tags: [availability]
      responses:
        "200":
          description: 본인 설정. configured이면 ETag는 설정 version이다.
          headers:
            ETag:
              description: configured일 때만 있다. 설정 version의 강한 ETag(예 "3").
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPreferencesEnvelope"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      summary: 내 활동 시간 전체 교체
      description: |
        주간 규칙 전체를 원자적으로 교체한다(docs/availability_search_design.md §3.2).

        - If-Match가 없으면 create-only다. 이미 설정이 있으면 409 version_conflict(current_version 포함).
        - If-Match가 있으면 그 version일 때만 교체한다. 설정이 없으면 409 version_conflict(current_version 0).
        - 시작·종료는 time_zone 기준 지역 시각의 분이며 30분 배수, 한 구간은 30분 이상 24시간 이하다.
        - **자정을 넘는 구간은 end_minute를 1440보다 크게(최대 2850, 시작 23:30 + 24시간) 보낸다.** 예: 월 22:00~02:00 =
          {weekday: 1, start_minute: 1320, end_minute: 1560}. 서버는 시작 요일의 자정 전 구간과 다음
          요일(일요일 7 → 월요일 1)의 자정 후 구간으로 나눠 저장하므로 응답에는 두 구간으로 돌아온다.
        - 나눈 뒤 같은 요일 구간이 겹치면(중복 포함) 400 invalid_request다. 맞닿은 구간은 병합한다.
        - 병합 뒤 요일별 3개 초과, 한 주 전체 0개, 입력 336개 초과는 400 invalid_request다.
        - time_zone은 내장 tzdata에 대소문자까지 정확히 있는 "Area/City" 형식의 IANA ID여야 한다. UTC, GMT,
          Etc/*(대소문자 무관), 고정 offset("UTC+09:00"), Local, "asia/seoul", "Asia//Seoul"은 거부하며 이때만
          code는 time_zone_invalid(400)다. 클라이언트는 기기 identifier가 Area/City가 아니면(예: GMT) 도시 선택
          UI를 띄운다.
        - create-only 요청을 새 Idempotency-Key로 다시 보내면 409 version_conflict가 될 수 있다. 같은 키 재전송은
          원래 결과를 돌려준다. 409를 받으면 GET으로 현재 상태를 확인한다. If-Match는 request hash에 들어가지 않는다.

        정규화 결과가 현재 설정과 같으면 version을 올리지 않는다. 바뀌면 version이 1 오르고 본인에게만
        availability_preference sync 변경(payload: status, version, updated_at)이 간다. sync payload에는
        구간과 time_zone이 없으므로 클라이언트는 이 변경을 받으면 GET으로 다시 읽는다.
      operationId: replaceMyAvailabilityPreferences
      tags: [availability]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          description: 교체할 현재 version(강한 ETag, 예 "3"). 첫 저장에는 보내지 않는다.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityPreferencesRequest"
      responses:
        "200":
          description: 저장된 정규형 설정.
          headers:
            ETag:
              description: 저장 뒤 설정 version의 강한 ETag(예 "3").
              schema: {type: string}
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPreferencesEnvelope"
        "400":
          description: 형식·필드 검증 실패는 invalid_request, time_zone 규칙 위반은 time_zone_invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/parties/{party_id}/availability/search:
    post:
      summary: Party 공통 가능 시간 검색
      description: |
        현재 Party의 모든 활성 멤버가 공통으로 가능한 시간만 돌려준다(docs/availability_search_design.md §4, §7.2).
        멤버 ID·공개 수준·개별 활동 시간은 입력으로 받지 않는다(모르는 필드는 400). 계산은 공개 수준과
        무관하게 private Busy facts를 쓴다. 응답과 오류에는 멤버 수, 가능 인원, 원인, 다른 멤버의 상태가 없다.

        - 요청 제한: 사용자·Party당 분당 20회, 사용자 전체 분당 60회. 본문 검증 전에 센다.
        - 기본값: start_date = time_zone 기준 오늘, end_date = 시작일 포함 14일째, duration_minutes 60,
          max_results 20. time_zone은 필수다(서버는 기기 시간대를 모른다).
        - 과거 start_date, end_date < start_date, 30~480분 30분 배수가 아닌 길이, 1~20이 아닌 max_results는
          400 invalid_request. 시작일 포함 31일 초과나 end_date가 오늘+89일보다 뒤면 400 search_range_invalid(멤버 snapshot은
          멤버 시간대 기준 90일이라 시간대 차이를 위해 하루를 남긴다).
        - 요청 날짜 범위의 UTC envelope가 모든 멤버의 active snapshot window 교집합 안에 없으면 400
          search_range_invalid(어느 멤버인지 알리지 않는다).
        - 슬롯은 RFC3339 UTC instant다. 같은 벽시계 시각이 DST fall-back으로 두 번 나올 수 있으므로 클라이언트는
          약식 시간대(EDT/EST 등)와 함께 표시한다.
        - calculation_version은 opaque 값이다. 제안 생성(설계 7)은 이 값과 같은 검색 조건(날짜를 명시한 값)을
          보내야 하며, 입력이 바뀌었거나 valid_until이 지났으면 409 availability_result_stale이다.
      operationId: searchPartyAvailability
      tags: [availability]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilitySearchRequest"
      responses:
        "200":
          description: 모든 준비 조건을 충족한 결과. 공통 슬롯이 없으면 slots는 빈 배열이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySearchResponse"
        "400":
          description: |
            invalid_request(형식·필드·한도), time_zone_invalid(지역 IANA 시간대가 아님),
            search_range_invalid(31일 초과, 90일 snapshot 밖, 멤버 snapshot window 미포함).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "404":
          description: 없는 Party, 해산된 Party, 비멤버, 떠난 멤버, 잘못된 id를 구분하지 않는다(code not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            availability_setup_pending(한 명 이상 활동 시간 미설정) 또는 calendar_sync_pending(한 명 이상 캘린더가
            계산 가능하지 않음: ready 또는 재동기화 중(syncing)이면서, 철회·오류·source 변경 뒤 새 snapshot이 완료된
            정상 generation이 있고 마지막 정상 sync가 6시간 이내여야 한다). 둘 다면 setup이 우선한다. self는 호출자 본인 상태만이다.
            availability_changed_retry는 검색 중 입력이 반복해서 바뀐 경우이며 self가 없다. 그대로 다시 검색한다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AvailabilityPendingError"
                  - $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: |
            availability_temporarily_unavailable(계산 기한 3초 초과, 부분 결과 없음) 또는 요청 제한 장치 장애(internal).
            Retry-After 뒤 같은 조건으로 재시도한다.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        1~128자의 출력 가능한 ASCII. 클라이언트는 UUID를 쓴다. (사용자, 기기, 키) 단위로
        30일간 결과를 보존한다. 같은 키로 같은 요청(method, route, 본문 바이트)을 다시
        보내면 원래 결과를 돌려주고, 다른 요청이면 409 idempotency_mismatch다.
      schema: {type: string, minLength: 1, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 현재 version을 강한 ETag로 싣는다. 예 "3". 약한 ETag와 *는 받지 않는다.
      schema: {type: string}
    DeviceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PartyID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InviteToken:
      name: token
      in: path
      required: true
      description: 초대 token 원문(최대 128자). 접근 로그에 path가 남지 않게 프록시에서 마스킹한다.
      schema: {type: string, minLength: 1, maxLength: 128}

  headers:
    RetryAfter:
      description: 재시도까지 기다릴 초(정수, 최소 1). 429에서는 창 종료까지 남은 초다. 남은 횟수와 한도는 알리지 않는다.
      schema: {type: integer, minimum: 1}
    IdempotentReplayed:
      description: 저장된 결과를 돌려준 재전송이면 "true". 본문은 현재 리소스 상태다.
      schema: {type: string, enum: ["true"]}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 15분 수명의 access token. 서명 외에 기기 폐기와 계정 상태를 매 요청 DB에서 확인한다.

  responses:
    Conflict:
      description: |
        version_conflict(낡은 If-Match, current_version 포함) 또는
        idempotency_mismatch(같은 키를 다른 요청에 재사용).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PartyDisbanded:
      description: 과거 멤버십이 있는 사용자가 해산된 Party를 대상으로 mutation했다(code party_disbanded).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 인증됐지만 대상 권한이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 없거나 이 사용자가 볼 수 없는 대상. 둘을 구분하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: 형식 또는 필드 검증 실패.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSession:
      description: 자격이 무효다. 원인(만료, 폐기, 위조, 재사용)을 구분하지 않는다. 클라이언트는 refresh를 시도하고, refresh도 401이면 다시 로그인한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: 계정이 active가 아니다(disabled, deletion_requested, deleting, deleted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: |
        요청 제한 초과(docs/rate_limit_design.md §6). Retry-After 이후에 재시도한다. 본문은 어느 키가
        초과했는지, 한도, 남은 횟수를 담지 않는다. **세션 상실이 아니다.** 클라이언트는 로그아웃하거나
        refresh token을 폐기하지 않는다.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: 서버 내부 오류(code internal). 본문에 원인을 담지 않는다. 클라이언트는 잠시 뒤 재시도한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Apple 같은 외부 의존성 장애, 또는 요청 제한 장치를 확인하지 못한 경우(closed scope). 사용자 자격 문제가 아니므로 클라이언트는 로그아웃하지 않고 Retry-After 이후 재시도한다.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AvailabilitySearchRequest:
      type: object
      required: [time_zone]
      additionalProperties: false
      properties:
        start_date: {type: string, format: date, description: "time_zone 기준 날짜. 기본 오늘"}
        end_date: {type: string, format: date, description: "시작일 포함. 기본 시작일 + 13일, 최대 시작일 + 30일·오늘 + 89일"}
        duration_minutes: {type: integer, minimum: 30, maximum: 480, multipleOf: 30, default: 60}
        time_zone: {type: string, maxLength: 64, description: "Area/City 형식의 IANA 시간대. 날짜와 30분 grid의 기준"}
        max_results: {type: integer, minimum: 1, maximum: 20, default: 20}
    AvailabilitySlot:
      type: object
      required: [start_at, end_at]
      additionalProperties: false
      properties:
        start_at: {type: string, format: date-time, description: "UTC(Z) instant"}
        end_at: {type: string, format: date-time, description: "UTC(Z) instant"}
    AvailabilitySearchResponse:
      type: object
      required: [request_id, slots, calculation_version, generated_at, valid_until]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        slots:
          type: array
          maxItems: 20
          description: 시작 시각 오름차순, 요청 시간대 날짜당 최대 3개.
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
        calculation_version: {type: string, description: "opaque. 내부 ID·version을 복원할 수 없다"}
        generated_at: {type: string, format: date-time}
        valid_until:
          type: string
          format: date-time
          description: min(generated_at + 5분, 가장 이른 멤버 last sync + 6시간). 이후 제안 생성에 쓸 수 없다.
    AvailabilitySelfState:
      type: object
      required: [activity, calendar]
      additionalProperties: false
      properties:
        activity: {type: string, enum: [configured, unconfigured]}
        calendar:
          type: string
          enum: [ready, not_connected, denied, revoked, syncing, source_required, error, stale]
    AvailabilityPendingError:
      type: object
      required: [code, message, request_id, self]
      additionalProperties: false
      properties:
        code: {type: string, enum: [availability_setup_pending, calendar_sync_pending]}
        message: {type: string}
        request_id: {type: string, format: uuid}
        self:
          $ref: "#/components/schemas/AvailabilitySelfState"
    AvailabilityIntervalInput:
      type: object
      required: [weekday, start_minute, end_minute]
      additionalProperties: false
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: "ISO 요일. 1=월요일, 7=일요일"}
        start_minute: {type: integer, minimum: 0, maximum: 1410, multipleOf: 30}
        end_minute:
          type: integer
          minimum: 30
          maximum: 2850
          multipleOf: 30
          description: 1440 초과는 자정을 넘어 다음 요일로 이어지는 구간이다. end_minute - start_minute는 30~1440이므로 최대 1410 + 1440 = 2850.

    AvailabilityInterval:
      type: object
      required: [weekday, start_minute, end_minute]
      additionalProperties: false
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7}
        start_minute: {type: integer, minimum: 0, maximum: 1410, multipleOf: 30}
        end_minute: {type: integer, minimum: 30, maximum: 1440, multipleOf: 30}

    AvailabilityPreferencesRequest:
      type: object
      required: [time_zone, weekly_intervals]
      additionalProperties: false
      properties:
        time_zone: {type: string, maxLength: 64, examples: ["Asia/Seoul"]}
        weekly_intervals:
          type: array
          minItems: 1
          maxItems: 336
          items:
            $ref: "#/components/schemas/AvailabilityIntervalInput"

    AvailabilityPreferences:
      type: object
      required: [status, time_zone, version, weekly_intervals, updated_at]
      additionalProperties: false
      properties:
        status: {type: string, enum: [unconfigured, configured]}
        time_zone: {type: [string, "null"], description: unconfigured이면 null}
        version: {type: integer, format: int64, minimum: 0, description: unconfigured이면 0}
        weekly_intervals:
          type: array
          maxItems: 21
          description: 정규형. 요일, 시작 순으로 정렬돼 있고 요일별 최대 3개이며 서로 겹치거나 맞닿지 않는다.
          items:
            $ref: "#/components/schemas/AvailabilityInterval"
        updated_at: {type: [string, "null"], format: date-time}

    AvailabilityPreferencesEnvelope:
      type: object
      required: [request_id, preferences]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        preferences:
          $ref: "#/components/schemas/AvailabilityPreferences"

    CreateCalendarSnapshotRequest:
      type: object
      required: [revision, window_start, window_end, expected_pages]
      additionalProperties: false
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        expected_pages: {type: integer, minimum: 0, maximum: 200}
        details_included: {type: boolean, default: false}

    CalendarSnapshotPageRequest:
      type: object
      required: [facts]
      additionalProperties: false
      properties:
        facts:
          type: array
          maxItems: 250
          items:
            type: object
            required: [source_event_key, start_at, end_at, all_day, time_zone, availability]
            additionalProperties: false
            properties:
              source_event_key: {type: string, description: 16~32바이트 base64url 무패딩 내부 키}
              start_at: {type: string, format: date-time}
