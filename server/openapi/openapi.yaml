    NotificationRefKey:
      type: string
      description: |
        본인 전용 32바이트 키(base64url, 패딩 없음). 알림 payload의 party_ref·entity_ref를
        역조회하는 데 쓴다(notification_design.md §4.3). 공유 keychain access group에만
        저장하고 로그에 남기지 않는다.

    SyncChange:
      type: object
      description: |
        적용 규칙(account_backend_design.md §7.1·§7.2, 2026-10-28 개정). 피드는 txid 순이고 직렬화 순서와 어긋날 수 있다.
        - upsert는 version이 로컬 version과 하한보다 클 때만 적용한다. version 있는 tombstone은 지우고 하한을 기록한다.
        - 규칙 (a): scope_membership_id가 끝난 멤버십(하한이 기록된 party_membership ID)인 upsert는 버린다.
        - 규칙 (b): version 없는 tombstone은 그 entity의 Party에 scope_membership_id가 아닌 본인 활성 멤버십이 로컬에
          있으면 무시한다(재가입으로 다시 받은 사본).
        - 부모 Party보다 먼저 온 하위 entity도 버리지 않고 보관한다.
      required: [entity_type, entity_id, operation, version, payload, scope_membership_id]
      additionalProperties: false
      properties:
        entity_type:
          type: string
          description: |
            user, device, availability_preference(본인 전용 무효화), party, party_membership,
            party_invite(현재 방장에게만), party_visibility_setting(본인 것만), party_schedule_projection.
            이후 도메인이 더한다. 한 트랜잭션 안에서 party upsert는 그 하위 entity upsert보다 먼저 온다.
            party_invite는 active인 것만 보내며 소진·무효화·위임·해산은 tombstone이다. 만료는 sync를 만들지
            않으므로 클라이언트가 expires_at으로 숨긴다. party_membership payload는 display_name을 싣고 그
            사용자가 이름을 바꾸면 멤버십 version이 올라 같은 Party 멤버 전원에게 다시 온다.
        entity_id: {type: string, format: uuid}
        operation: {type: string, enum: [upsert, tombstone]}
        version:
          type: [integer, "null"]
          format: int64
          description: |
            upsert에는 필수다. 삭제·종료된 entity(Party projection·공개 설정·종료 멤버십·해산 Party·끝난 초대)의
            tombstone은 version을 싣고, 클라이언트는 그 version을 하한으로 기록해 하한 이하의 upsert를 무시한다. null인 tombstone은
            서버에 남아 있지만 수신자의 scope에서 빠진 entity(탈퇴자가 보던 Party·다른 멤버 entity)이며, 로컬 row만
            지우고 version 하한을 기록하지 않는다(재가입 시 같은 version으로 다시 온다).
        payload:
          type: [object, "null"]
          description: 최소 projection. 캘린더 상세와 token은 담지 않는다. tombstone은 null이다.
        scope_membership_id:
          type: [string, "null"]
          format: uuid
          description: |
            Party 범위 entity(party, party_membership, party_invite, party_visibility_setting,
            party_schedule_projection)에서 이 변경을 발행할 때의 수신자 멤버십 ID. 활성 멤버에게는 활성 멤버십,
            떠났거나 해산으로 끝난 수신자에게는 끝난 그 멤버십이다. Party 밖 entity는 null이다.

    SyncResponse:
      type: object
      required: [request_id, changes, cursor, has_more, server_time]
      additionalProperties: false
      properties:
        request_id: {type: string, format: uuid}
        changes:
